name: Update data and deploy

# Runs by itself; nothing here needs a person once the deploy settings for one host are set: the VERCEL_TOKEN secret
# with the VERCEL_ORG_ID and VERCEL_PROJECT_ID variables, or the two Cloudflare secrets.
# - Every run decides what is due (scripts/update-data.mjs): a full update about once a day, otherwise only the films
#   in cinemas. GitHub delays and drops scheduled runs, so this is decided by the data's age, not by the time of day.
# - A data source that fails or is slow is skipped and the last good data is used; progress is kept for the next run.
# - A build that has lost many films is not deployed (scripts/check-data.mjs); the site stays as it was.
# - GitHub emails the repository owner when a run fails: a deploy that failed three times, a build that was held back,
#   or a source that has not been read for days.
on:
  schedule:
    # Every 3 hours, off the hour: GitHub delays and drops more runs at :00.
    - cron: '23 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write # only for the keep-alive commit at the end

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A normal run takes about 20 minutes. Only a run with no saved data comes near this, and every data script has its
    # own time limit inside it (scripts/update-data.mjs), so the data read so far is still saved for the next run.
    timeout-minutes: 330
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' && vars.VERCEL_ORG_ID != '' && vars.VERCEL_PROJECT_ID != '' }}
      CF_PROJECT: ${{ vars.CF_PROJECT || 'livegross' }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      SITE_OWNER: ${{ vars.SITE_OWNER }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      CONTACT_UA: ${{ vars.CONTACT_UA }}
      GA_ID: ${{ vars.GA_ID }}
      ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      IMDB_RATINGS: ${{ vars.IMDB_RATINGS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Everything the data scripts have read (data/raw/) is kept between runs, so a run only re-reads what is due.
      # It is saved by its own step below whatever happens in between, so even a failed run keeps its progress.
      - name: Restore fetched data
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-data-

      # Next.js build cache (compiled code) makes rebuilds faster.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npm test

      - name: Fetch data
        id: fetch
        run: node scripts/update-data.mjs

      # merge → posters, photos, India/overseas figures, page views → next build (static export to out/) → postbuild
      - name: Build site
        run: npm run build

      - name: Check the build before deploying
        run: node scripts/check-data.mjs --before-deploy

      - name: Save fetched data
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creates the Pages project on the first run; fails harmlessly once it exists.
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main || true
          for attempt in 1 2 3; do
            npx --yes wrangler@4 pages deploy out --project-name="$CF_PROJECT" --branch=main && exit 0
            echo "Deploy attempt $attempt failed."
            [ "$attempt" -lt 3 ] && sleep 90
          done
          exit 1

      # Uploads out/ as it is (vercel.json inside sets the headers); Vercel builds nothing. One archive instead of
      # ~14,000 separate files.
      - name: Deploy to Vercel
        if: env.HAS_VERCEL == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          for attempt in 1 2 3; do
            npx --yes vercel@65.2.0 deploy out --prod --yes --archive=tgz --token="$VERCEL_TOKEN" && exit 0
            echo "Deploy attempt $attempt failed."
            [ "$attempt" -lt 3 ] && sleep 90
          done
          exit 1

      - name: Not deployed
        if: env.HAS_CLOUDFLARE != 'true' && env.HAS_VERCEL != 'true'
        run: echo "::notice::Built but not deployed. Add the VERCEL_TOKEN secret (with the VERCEL_ORG_ID and VERCEL_PROJECT_ID variables), or the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, to put the site online."

      # GitHub switches off the schedule of a public repository after 60 days without a commit. When the last commit
      # is 45 days old, the run commits a short data summary (data/status.json), so the schedule never stops.
      - name: Keep the schedule running
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt $(( 45 * 86400 )) ]; then echo "Last commit $(( age / 86400 )) days ago; nothing to do."; exit 0; fi
          node scripts/check-data.mjs --status > data/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/status.json
          git commit -m 'Keep the scheduled update running'
          git push || echo "::warning::Keep-alive commit not pushed; the next run tries again."

      # Once a day (with the full update): fails, so GitHub sends an email, when a source has not been read for days.
      - name: Check every data source is still being read
        if: ${{ !cancelled() && steps.fetch.outputs.mode == 'full' }}
        run: node scripts/check-data.mjs --freshness
